<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AutoGrade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #06b6d4;
            --primary-hover: #22d3ee;
            --bg: #020617;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.6);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.04) 0%, transparent 40%),
                linear-gradient(rgba(30, 41, 59, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 360px;
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 0.4rem;
            color: var(--text-main);
            text-align: center;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            opacity: 0.8;
        }

        input {
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 1.25rem;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            color: white;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(6, 182, 212, 0.04);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
            transform: translateY(-1px);
        }

        button {
            background-color: var(--primary);
            color: #020617;
            padding: 0.85rem;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
            margin-bottom: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        button:hover {
            background-color: white;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .footer-text a:hover {
            color: white;
        }

        #message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.8rem;
            min-height: 1.25rem;
            color: #22d3ee;
            font-weight: 500;
        }

        br {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Register</h2>
        <p class="subtitle">Join AutoGrade to start evaluating.</p>

        <form id="registerForm">
            <label>Username:</label>
            <input type="text" id="username" placeholder="Choose a username" required>

            <label>Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password:</label>
            <input type="password" id="password" placeholder="••••••••" required>

            <button type="submit">Register</button>
        </form>

        <p class="footer-text">Already have an account? <a href="/login">Login here</a></p>

        <p id="message"></p>
    </div>


    <script>
        document.getElementById("registerForm").onsubmit = async function (e) {

            e.preventDefault();

            const response = await fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username.value,
                    email: email.value,
                    password: password.value
                })
            });

            const data = await response.json();

            document.getElementById("message").innerText =
                response.ok ? "User registered successfully!" : data.detail;
        };
    </script>

</body>

</html>
