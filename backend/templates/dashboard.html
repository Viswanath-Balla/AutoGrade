<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
</head>

<body style="margin: 0; font-family: sans-serif;">

    <div style="display: flex; height: 100vh;">
        <!-- Sidebar -->
        <div style="width: 200px; background-color: #f4f4f4; padding: 20px; border-right: 1px solid #ddd;">
            <h3>Menu</h3>
            <ul style="list-style-type: none; padding: 0;">
                <li style="margin-bottom: 10px;"><a href="/dashboard"
                        style="text-decoration: none; color: #333;">Dashboard</a></li>
                <li style="margin-bottom: 10px;"><a href="/evaluate"
                        style="text-decoration: none; color: #333;">Evaluate</a></li>
                <li style="margin-bottom: 10px;"><a href="#" onclick="logout()"
                        style="text-decoration: none; color: #333;">Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div style="flex-grow: 1; padding: 20px;">
            <h2>Welcome {{username}} 🎉</h2>
            <p>You are logged in.</p>

            <hr>

            <h3>Upload Question Paper</h3>
            <p>Select a question paper from your local storage to upload:</p>
            <form id="uploadForm" action="/upload-question-paper" method="POST" enctype="multipart/form-data">
                <input type="file" id="questionPaper" name="questionPaper">
                <br><br>
                <button type="submit">Upload</button>
            </form>
            <p id="message"></p>
        </div>
    </div>

    <script>
        function logout() {
            window.location.href = "/logout";
        }

        function uploadPaper() {
            // Placeholder for upload logic
            const fileInput = document.getElementById('questionPaper');
            if (fileInput.files.length > 0) {
                alert("File selected: " + fileInput.files[0].name);
            } else {
                alert("Please select a file.");
            }
        }

        document.getElementById("uploadForm").onsubmit = async function (e) {

            e.preventDefault();

            const response = await fetch("/upload-question-paper", {
                method: "POST",
                body: new FormData(this)
            });

            const data = await response.json();

            document.getElementById("message").innerText =
                response.ok ? data.message : data.detail;
        };

    </script>

</body>

</html>
