<!DOCTYPE html>
<html>

<body>

<h2>Welcome {{username}} 🎉</h2>

<p>You are logged in.</p>

<button onclick="logout()">Logout</button>

<script>

function logout(){
    localStorage.removeItem("token");
    window.location.href = "/login";

}

</script>
