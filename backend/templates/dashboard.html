<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AutoGrade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #06b6d4;
            --primary-hover: #22d3ee;
            --bg: #020617;
            --sidebar-bg: rgba(15, 23, 42, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(30, 41, 59, 0.3);
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.04) 0%, transparent 40%);
            color: var(--text-main);
            overflow: hidden;
        }

        .layout {
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            padding: 2.25rem 1.25rem;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(25px);
        }

        .sidebar h3 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--primary);
            margin-bottom: 2rem;
            padding-left: 0.75rem;
            opacity: 0.6;
        }

        .sidebar ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            margin-bottom: 0.6rem;
        }

        .sidebar a {
            text-decoration: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            font-size: 0.9rem;
        }

        .sidebar a:hover {
            color: var(--primary);
            background-color: rgba(6, 182, 212, 0.04);
            border-color: rgba(6, 182, 212, 0.1);
            transform: translateX(4px);
        }

        .sidebar a.active {
            background-color: rgba(6, 182, 212, 0.08);
            color: var(--primary);
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.1);
        }

        /* Main Content Styling */
        .main-content {
            flex-grow: 1;
            padding: 2.5rem 3.5rem;
            overflow-y: auto;
        }

        .header-section {
            margin-bottom: 2.5rem;
        }

        .header-section h2 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
            margin-bottom: 0.4rem;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .header-section p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
            opacity: 0.8;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 2rem;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            transition: all 0.4s ease;
        }

        .card:hover {
            border-color: rgba(6, 182, 212, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-main);
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 1.25rem;
            background: rgba(255, 255, 255, 0.01);
            border: 1.5px dashed var(--border);
            border-radius: 14px;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-muted);
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        input[type="file"]:hover {
            border-color: var(--primary);
            background: rgba(6, 182, 212, 0.03);
        }

        input[type="file"]::file-selector-button {
            background-color: rgba(6, 182, 212, 0.1);
            color: var(--primary);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            margin-right: 1.25rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        input[type="file"]:hover::file-selector-button {
            background-color: var(--primary);
            color: #020617;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: #020617;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        button:hover {
            background-color: white;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
        }

        #message {
            margin-top: 1.25rem;
            font-weight: 500;
            color: var(--primary);
            font-size: 0.9rem;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 2.5rem 0;
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <div class="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li><a href="/dashboard" class="active">Dashboard</a></li>
                <li><a href="/evaluate">Evaluate</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header-section">
                <h2>Welcome {{username}} 🎉</h2>
                <p>You are logged in to your AutoGrade account.</p>
            </div>

            <hr>

            <div class="card">
                <h3>Upload Question Paper</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Select a question paper from your local
                    storage to upload:</p>
                <form id="uploadForm" action="/upload-question-paper" method="POST" enctype="multipart/form-data">
                    <input type="file" id="questionPaper" name="questionPaper">
                    <button type="submit">Upload Paper</button>
                </form>
                <p id="message"></p>
            </div>
        </div>
    </div>

    <script>
        function logout() {
            window.location.href = "/logout";
        }

        function uploadPaper() {
            // Placeholder for upload logic
            const fileInput = document.getElementById('questionPaper');
            if (fileInput.files.length > 0) {
                alert("File selected: " + fileInput.files[0].name);
            } else {
                alert("Please select a file.");
            }
        }

        document.getElementById("uploadForm").onsubmit = async function (e) {

            e.preventDefault();

            const response = await fetch("/upload-question-paper", {
                method: "POST",
                body: new FormData(this)
            });

            const data = await response.json();

            document.getElementById("message").innerText =
                response.ok ? data.message : data.detail;
        };

    </script>

</body>

</html>
