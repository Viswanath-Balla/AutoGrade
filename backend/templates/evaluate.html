<div class="card">
    <div id="evaluateForm">

        <h3><span class="step-number">1</span> Select Question Paper</h3>

        <select id="questionPaperSelect" name="paper_id" required>
            <option value="">Select a Question Paper</option>
            {% for paper in question_papers %}
            <option value="{{ paper.qp_id }}">{{ paper.qp_name }}</option>
            {% endfor %}
        </select>

        <br><br>

        <h3><span class="step-number">2</span> Upload Answer Sheets</h3>

        <!-- ✅ multiple added -->
        <input type="file" name="answerSheet" id="answerSheet" multiple accept=".pdf" required>

        <div id="fileList"></div>

        <button type="button" id="submitBtn" onclick="handleSubmit()">Start Evaluation</button>

    </div>

    <p id="message"></p>

    <!-- ✅ Results render here, one card per student -->
    <div id="results"></div>
</div>

<script>
async function handleSubmit() {
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    const resultsContainer = document.getElementById("results");

    const paperId = document.getElementById("questionPaperSelect").value;
    const files = document.getElementById("answerSheet").files;

    if (!paperId) {
        message.textContent = "❌ Please select a question paper.";
        return;
    }
    if (files.length === 0) {
        message.textContent = "❌ Please upload at least one answer sheet.";
        return;
    }

    // Reset UI
    resultsContainer.innerHTML = "";
    message.textContent = `⏳ Evaluating 0 of ${files.length} sheets...`;
    submitBtn.disabled = true;
    submitBtn.textContent = "Processing...";

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        message.textContent = `⏳ Evaluating ${i + 1} of ${files.length}: ${file.name}`;

        // Build a placeholder card immediately so user sees progress
        const studentCard = document.createElement("div");
        studentCard.style.cssText = "border:1px solid #ccc; border-radius:10px; padding:16px; margin-bottom:20px;";
        studentCard.innerHTML = `
            <h3 style="margin:0 0 8px 0;">📋 Student ${i + 1}: ${file.name}</h3>
            <p id="status-${i}" style="color:#888;">⏳ Processing...</p>
            <div id="content-${i}"></div>
        `;
        resultsContainer.appendChild(studentCard);

        const formData = new FormData();
        formData.append("paper_id", paperId);
        formData.append("answerSheet", file);

        try {
            const response = await fetch("/evaluate", {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            const statusEl = document.getElementById(`status-${i}`);
            const contentEl = document.getElementById(`content-${i}`);

            if (response.ok) {
                statusEl.textContent = "✅ Done";
                statusEl.style.color = "green";

                // Question paper text (collapsible)
                const qpToggle = document.createElement("details");
                qpToggle.innerHTML = `
                    <summary style="cursor:pointer; font-weight:bold; margin-bottom:8px;">📄 Question Paper Text</summary>
                    <pre style="white-space:pre-wrap; word-break:break-word; font-family:inherit;">${escapeHtml(data.question_paper_text)}</pre>
                `;
                contentEl.appendChild(qpToggle);

                // Answers section
                const answersHeader = document.createElement("h4");
                answersHeader.textContent = "✍️ Extracted Answers";
                answersHeader.style.marginTop = "12px";
                contentEl.appendChild(answersHeader);

                const answers = data.answers_by_question;

                if (answers.raw) {
                    const block = document.createElement("pre");
                    block.style.cssText = "white-space:pre-wrap; word-break:break-word; font-family:inherit;";
                    block.textContent = answers.raw;
                    contentEl.appendChild(block);
                } else {
                    for (const [questionKey, answerText] of Object.entries(answers)) {
                        const qCard = document.createElement("div");
                        qCard.style.cssText = "border:1px solid #ddd; border-radius:8px; padding:12px; margin-bottom:10px;";

                        const label = document.createElement("h4");
                        label.textContent = questionKey.toUpperCase();
                        label.style.cssText = "margin:0 0 6px 0; color:#333;";

                        const text = document.createElement("pre");
                        text.textContent = answerText;
                        text.style.cssText = "margin:0; white-space:pre-wrap; word-break:break-word; font-family:inherit;";

                        qCard.appendChild(label);
                        qCard.appendChild(text);
                        contentEl.appendChild(qCard);
                    }
                }

            } else {
                statusEl.textContent = "❌ Error: " + data.detail;
                statusEl.style.color = "red";
            }

        } catch (err) {
            document.getElementById(`status-${i}`).textContent = "❌ Network error: " + err.message;
            document.getElementById(`status-${i}`).style.color = "red";
        }
    }

    message.textContent = `✅ Finished evaluating ${files.length} sheet(s).`;
    submitBtn.disabled = false;
    submitBtn.textContent = "Start Evaluation";
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
}
</script>
