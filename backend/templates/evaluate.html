<div class="card">
    <form id="evaluateForm" method="POST" action="/evaluate" enctype="multipart/form-data">

        <h3><span class="step-number">1</span> Select Question Paper</h3>

        <select id="questionPaperSelect" name="paper_id" required>
            <option value="">Select a Question Paper</option>
            {% for paper in question_papers %}
            <option value="{{ paper.qp_id }}">{{ paper.qp_name }}</option>
            {% endfor %}
        </select>

        <br><br>

        <h3><span class="step-number">2</span> Upload Answer Sheet</h3>

        <input type="file" name="answerSheet" id="answerSheet" required>

        <div id="fileList"></div>

        <button type="submit">Start Evaluation</button>

    </form>

    <p id="message"></p>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    document.getElementById("evaluateForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const formData = new FormData(this);

        const response = await fetch("/evaluate", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (response.ok) {
            document.getElementById("message").textContent =
                "========== QUESTION PAPER TEXT ==========\n\n" +
                data.question_paper_text +
                "\n\n========== ANSWER SHEET TEXT ==========\n\n" +
                data.answer_sheet_text;
        } else {
            document.getElementById("message").textContent = data.detail;
        }
    });

});
</script>
