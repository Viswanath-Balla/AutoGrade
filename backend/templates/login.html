<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoGrade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #06b6d4;
            --primary-hover: #22d3ee;
            --bg: #020617;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --neon-glow: rgba(6, 182, 212, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            /* Techy Mesh Gradient */
            background-image:
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(129, 140, 248, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(129, 140, 248, 0.1) 0px, transparent 50%),
                linear-gradient(rgba(30, 41, 59, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Glow */
        body::before {
            content: '';
            position: absolute;
            width: 300%;
            height: 300%;
            top: -100%;
            left: -100%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.03) 0%, transparent 70%);
            animation: rotateGlow 20s linear infinite;
            z-index: -1;
        }

        @keyframes rotateGlow {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(10%, 10%) rotate(180deg);
            }

            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 360px;
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 0.4rem;
            color: var(--text-main);
            text-align: center;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            opacity: 0.8;
        }

        input {
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 1.25rem;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            color: white;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(6, 182, 212, 0.04);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
            transform: translateY(-1px);
        }

        button {
            background-color: var(--primary);
            color: #020617;
            padding: 0.85rem;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
            margin-bottom: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        button:hover {
            background-color: white;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3);
        }

        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .footer-text a:hover {
            color: white;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        br {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Login</h2>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <form id="loginForm">

            <label>Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password:</label>
            <input type="password" id="password" placeholder="••••••••" required>

            <button type="submit">Login</button>

        </form>

        <p class="footer-text">Don't have an account? <a href="/register">Register here</a></p>
    </div>


    <script>

        document.getElementById("loginForm").onsubmit = async function (e) {

            e.preventDefault();

            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email.value,
                    password: password.value
                })
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.detail || "Login failed");
                return;
            }

            // Cookie is set by server automatically
            window.location.href = "/dashboard";
        }

    </script>


</body>

</html>
